# Put this file in your profile repository (malsaaaa/malsaaaa) at .github/workflows/koi.yml
# Then show the koi in README.md with: <img src="koi/koi.gif" width="256" alt="My koi" />
# Based on the example workflow from https://github.com/yalongwastaken/git-koi (MIT licence).
name: Koi

on:
  schedule:
    # Just after midnight UTC, so the koi shows the day that just ended.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/koi.yml]

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to a full release tag so the code only changes when you update it.
      - uses: yalongwastaken/git-koi@v1.0.2
        with:
          # One of: white, black, asagi, tea, gold, platinum
          body: asagi
          output-dir: koi
      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi/koi.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"
          git push --quiet
